<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header-container h1 {
            margin: 0;
            text-align: center;
        }

        .nav-icon {
            position: absolute;
            left: 0;
            color: #4B0082;
            font-size: 24px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-icon:hover {
            color: #9370DB;
        }

        .user-message {
            background-color: #f0e6ff;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            max-width: 80%;
            margin-left: auto;
            color: #4B0082;
        }

        .assistant-message {
            background-color: #f8f5ff;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            max-width: 80%;
            margin-right: auto;
            color: #4B0082;
        }

        .assistant-message strong {
            color: #8A2BE2;
        }

        .assistant-message em {
            color: #9370DB;
        }

        .assistant-message br {
            margin-bottom: 8px;
            display: block;
            content: "";
        }

        .assistant-message ul {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .assistant-message li {
            margin-bottom: 4px;
        }

        .error-message {
            background-color: #ffebee;
            padding: 10px;
            border-radius: 10px;
            margin: 5px 0;
            color: #c62828;
        }

        #chat-container {
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(147, 112, 219, 0.1);
        }

        .btn:hover {
            background: linear-gradient(145deg, #8A2BE2, #9370DB) !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(147, 112, 219, 0.2);
        }

        .form-control:focus {
            border-color: #9370DB;
            box-shadow: 0 0 0 0.2rem rgba(147, 112, 219, 0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="header-container">
            <a href="{{ url_for('home') }}" class="nav-icon" title="Home">
                <i class="fas fa-home"></i>
            </a>
            <h1>📚 Learnora</h1>
        </div>
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header" style="background: linear-gradient(145deg, #9370DB, #8A2BE2);">
                        <h3 class="mb-0 text-white">Explore ideas with me </h3>
                    </div>
                    <div class="card-body">
                        <div id="chat-container" class="mb-3" style="height: 400px; overflow-y: auto;">
                            <div class="assistant-message">
                                What would you like to learn about today?
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="user-input" class="form-control" placeholder="Type your message here...">
                            <button class="btn" onclick="sendMessage()" id="send-button" style="background: linear-gradient(145deg, #9370DB, #8A2BE2); color: white; border: none;">Send</button>
                        </div>
                        <small class="text-muted mt-2">Type 'exit', 'quit', or 'bye' to end the conversation</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const userInput = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const message = userInput.value.trim();
            
            if (message) {
                // Add user message
                chatContainer.innerHTML += `
                    <div class="user-message mt-2">
                        ${message}
                    </div>
                `;
                
                // Clear input
                userInput.value = '';
                
                // Scroll to bottom
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // Send to server
                fetch('/learn_with_me', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `user_input=${encodeURIComponent(message)}`
                })
                .then(response => response.json())
                .then(data => {
                    // Format the response text
                    let formattedResponse = data.response
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold text
                        .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic text
                        .replace(/\n/g, '<br>') // Line breaks
                        .replace(/\s{2,}/g, ' ') // Multiple spaces
                        .replace(/\*\s/g, '<br>• ') // Bullet points
                        .replace(/\n\*/g, '<br>• '); // Bullet points with newlines

                    // Add assistant response
                    chatContainer.innerHTML += `
                        <div class="assistant-message mt-2">
                            ${formattedResponse}
                        </div>
                    `;
                    
                    // Scroll to bottom
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    
                    if (data.end_session) {
                        userInput.disabled = true;
                        document.getElementById('send-button').disabled = true;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    chatContainer.innerHTML += `
                        <div class="error-message mt-2">
                            An error occurred. Please try again.
                        </div>
                    `;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                });
            }
        }
    </script>
</body>
</html>
