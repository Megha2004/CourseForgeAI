<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Course Forge AI</title>
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .header-title-desc h1 {
            color: #4B0082;
            font-size: 3em;
            margin: 0;
            font-weight: 700;
        }

        .header-title-desc .description {
            color: #666;
            font-size: 1.5em;
            margin-top: 10px;
            max-width: 800px;
            line-height: 1.4;
            font-weight: 400;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: #4B0082;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(147, 112, 219, 0.2);
        }

        .feature-card i {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #9370DB;
        }

        .feature-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }

        .feature-card p {
            margin: 0;
            color: #666;
            line-height: 1.4;
            font-size: 0.9em;
        }

        .chat-float-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #9370DB, #8A2BE2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(147, 112, 219, 0.3);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .chat-float-button i {
            font-size: 1.5em;
        }

        .chat-float-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(147, 112, 219, 0.4);
        }

        @media (max-width: 1200px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .features-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .header-title-desc h1 {
                font-size: 2.5em;
            }

            .header-title-desc .description {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <div class="header-title-desc">
                <h1>Course Forge AI</h1>
                <p class="description">Your comprehensive learning platform with AI-powered tools</p>
            </div>
        </div>

        <div class="features-grid">
            {% for code, feature in features.items() %}
                {% if code != 'chatbot' %}
                <a href="/{{ feature.route }}" class="feature-card">
                    <i class="{{ feature.icon }}"></i>
                    <h2>{{ feature.title }}</h2>
                    <p>{{ feature.description }}</p>
                </a>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <a href="/chatbot" class="chat-float-button">
        <i class="fas fa-robot"></i>
    </a>
</body>
</html>
