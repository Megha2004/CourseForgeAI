<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Me - Course Forge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        .nav-icon {
            font-size: 24px;
            color: #4B0082;
            text-decoration: none;
            transition: color 0.3s ease;
            position: absolute;
            left: 0;
        }

        .nav-icon:hover {
            color: #9370DB;
        }

        h1 {
            color: #4B0082;
            text-align: center;
            margin: 0;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.1);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #4B0082;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #9370DB;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4B0082;
        }

        button {
            background: linear-gradient(145deg, #9370DB, #8A2BE2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .notes-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.1);
            margin-top: 30px;
            line-height: 1.6;
            color: #333;
            font-size: 14px;
            text-align: left;
        }

        .notes-container h2 {
            color: #4B0082;
            font-size: 18px;
            margin: 30px 0 20px 0;
            font-weight: 600;
        }

        .notes-container strong {
            color: #4B0082;
            font-weight: 600;
            display: block;
            margin: 20px 0 10px 0;
        }

        .notes-container p {
            margin: 0 0 15px 0;
            line-height: 1.6;
            color: #333;
            text-align: left;
        }

        .notes-container ul {
            margin: 0 0 20px 0;
            padding-left: 20px;
        }

        .notes-container li {
            margin-bottom: 8px;
            line-height: 1.6;
            position: relative;
            padding-left: 15px;
        }

        .notes-container li:before {
            content: "•";
            color: #4B0082;
            position: absolute;
            left: 0;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .loading i {
            font-size: 24px;
            color: #4B0082;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .form-container, .notes-container {
                padding: 20px;
            }
        }

        .alert {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .btn-outline-primary {
            color: #4B0082;
            border-color: #4B0082;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: #4B0082;
            color: white;
        }

        .d-flex {
            display: flex;
        }

        .justify-content-between {
            justify-content: space-between;
        }

        .align-items-center {
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <a href="{{ url_for('home') }}" class="nav-icon" title="Home">
                <i class="fas fa-home"></i>
            </a>
            <h1>📚 Tutor Me</h1>
        </div>

        <div class="form-container">
            <form method="POST" onsubmit="clearPreviousAnswer()">
                <div class="form-group">
                    <label for="topic">What would you like to learn about?</label>
                    <input type="text" id="topic" name="topic" placeholder="Enter a topic..." required>
                </div>
                <button type="submit">Generate Notes</button>
            </form>
        </div>

        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i>
            <p>Generating detailed notes...</p>
        </div>

        {% if error %}
        <div class="error">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        {% if message and not message.startswith("I'm sorry") %}
        <div class="alert alert-success">
            <div class="d-flex justify-content-between align-items-center">
                <span>{{ message }}</span>
                {% if filename %}
                <a href="{{ url_for('download_notes', filename=filename) }}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-download"></i> Download Notes
                </a>
                {% endif %}
            </div>
        </div>
        {% elif message %}
        <div class="alert alert-warning">
            <span>{{ message }}</span>
        </div>
        {% endif %}

        {% if notes %}
        <div class="notes-container" id="notesContainer">
            {{ notes | safe }}
        </div>
        {% endif %}
    </div>

    <script>
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
        }

        function clearPreviousAnswer() {
            // Clear the notes container
            const notesContainer = document.getElementById('notesContainer');
            if (notesContainer) {
                notesContainer.innerHTML = '';
            }
            
            // Clear any existing alerts
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => alert.remove());
            
            // Clear any existing errors
            const errors = document.querySelectorAll('.error');
            errors.forEach(error => error.remove());
            
            // Show loading indicator
            showLoading();
        }
    </script>
</body>
</html>
