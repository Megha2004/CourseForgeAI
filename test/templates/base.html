<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhiData - {% block title %}{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(145deg, #9370DB, #8A2BE2);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #f0e6ff !important;
        }
        .card {
            box-shadow: 0 4px 6px rgba(147, 112, 219, 0.1);
            border: none;
        }
        .card-header {
            border-bottom: none;
        }
        .nav-link i {
            margin-right: 5px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/knowledge"><i class="fas fa-graduation-cap"></i>Knowledge</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/coding"><i class="fas fa-code"></i>Coding</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/notes"><i class="fas fa-book-open"></i>Notes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/flashcards"><i class="fas fa-clone"></i>Flashcards</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/chatbot"><i class="fas fa-robot"></i>Chatbot</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/matching_cards"><i class="fas fa-puzzle-piece"></i>Matching Cards</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tutor_me"><i class="fas fa-chalkboard-teacher"></i>Tutor Me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/learn_with_me"><i class="fas fa-book-reader"></i>Learnora</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3" style="background-color: rgba(147, 112, 219, 0.05);">
            © 2024 PhiData - Your Learning Companion
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
